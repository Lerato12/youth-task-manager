<!DOCTYPE html>
<html>
<head>
    <title> Task App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Cover page styling */
        #coverPage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #d6eaf8; /* pastel blue */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
            transition: opacity 2s ease; /* fade effect */
        }

        #coverPage h1 {
            color: #4a4a8c;
            font-size: 40px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        /* Main content hidden at first */
        #mainContent {
            display: none;
            padding: 20px;
            background-color: #fefefe;
        }

        h2 {
            color: #5d6d7e;
            margin-top: 20px;
        }

        form {
            background-color: #fce4ec; /* pastel pink */
            padding: 15px;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        input[type="text"], input[type="date"] {
            margin: 5px 0;
            padding: 5px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #aed6f1; /* pastel blue */
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        ul {
            background-color: #d5f5e3; /* pastel green */
            padding: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #fdf2e9; /* pastel orange */
            box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
        }

        th {
            background-color: #d6eaf8;
        }
    </style>
    <script>
        // Fade out cover page after 3 seconds
        window.onload = function() {
            setTimeout(function() {
                var cover = document.getElementById("coverPage");
                cover.style.opacity = "0"; // start fade
                setTimeout(function() {
                    cover.style.display = "none"; // hide after fade
                    document.getElementById("mainContent").style.display = "block";
                }, 2000); // wait for fade duration (2s)
            }, 3000); // show cover for 3 seconds
        };
    </script>
</head>
<body>
    <!-- Cover Page -->
    <div id="coverPage">
        <h1>Welcome to  Task Tracker</h1>
    </div>

    <!-- Main Content -->
    <div id="mainContent">
        <h2>Create a Task</h2>
        <form>
            <label>Task Name:</label><br>
            <input type="text" name="taskname"><br><br>

            <label>Assigned To:</label><br>
